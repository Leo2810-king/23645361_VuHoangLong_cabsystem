# Nhân viên quản lý
openapi: 3.0.3

info:
  title: CAB System API - Admin
  description: APIs for operational management
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Admin
    description: APIs for operational management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /admin/customers:
    get:
      tags: [Admin]
      summary: List customers
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Customer list}
        '403': {description: Forbidden}

  /admin/drivers:
    get:
      tags: [Admin]
      summary: Manage drivers
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Driver list}

  /admin/vehicles:
    get:
      tags: [Admin]
      summary: Manage vehicles
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Vehicle list}

  /admin/trips:
    get:
      tags: [Admin]
      summary: Search and manage trips
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Trip list}

  /admin/trips/active:
    get:
      tags: [Admin]
      summary: View active trips
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active trips}

  /admin/drivers/status:
    get:
      tags: [Admin]
      summary: Check driver statuses
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Driver status list}

  /admin/trips/{tripId}/resolve:
    post:
      tags: [Admin]
      summary: Resolve problematic trip
      security: [{bearerAuth: []}]
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            example:
              action: MANUAL_RESOLVE
              note: Resolved by operator
      responses:
        '200': {description: Trip resolved}
        '403': {description: Forbidden}

  /admin/payments:
    get:
      tags: [Admin]
      summary: Search payment transaction history
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Payment transaction list}
