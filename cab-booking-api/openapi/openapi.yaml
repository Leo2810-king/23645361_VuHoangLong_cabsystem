components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Nhập JWT access token. Ví dụ: Bearer eyJhbGciOi..."

  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      schema:
        type: string
      example: RIDE001

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
      example: DRV001

    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
      example: VEH001

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
      example: PAY001

    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
      example: NOTI001

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    ReportFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2026-09-01'

    ReportTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2026-09-30'

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa đăng nhập hoặc JWT không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    Role:
      type: string
      enum: [CUSTOMER, DRIVER, STAFF, ADMIN]

    ServiceType:
      type: string
      enum: [MOTORBIKE, CAR_4, CAR_7]

    DriverAvailability:
      type: string
      enum: [OFFLINE, ONLINE, AVAILABLE, BUSY]

    RideStatus:
      type: string
      enum:
        - SEARCHING_DRIVER
        - DRIVER_ASSIGNED
        - ARRIVED
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - NO_DRIVER_AVAILABLE

    PaymentMethod:
      type: string
      enum: [CASH, E_WALLET, CARD]

    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, REFUNDED]

    RegisterRequest:
      type: object
      required: [fullName, phone, password]
      properties:
        fullName:
          type: string
          minLength: 2
          example: Nguyen Van A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          example: a@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password@123

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          example: '0901234567'
        password:
          type: string
          format: password
          example: Password@123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        userId:
          type: string
          example: USR001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          example: a@example.com
        role:
          $ref: '#/components/schemas/Role'
        verified:
          type: boolean
          example: true

    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            totalRides:
              type: integer
              example: 15

    UpdateCustomerRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: new@example.com

    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
        address:
          type: string
          example: Quận 1, TP.HCM

    RideRequest:
      type: object
      required: [pickup, destination, serviceType]
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        serviceType:
          $ref: '#/components/schemas/ServiceType'

    RideEstimate:
      type: object
      properties:
        distanceKm:
          type: number
          format: double
          example: 8.5
        estimatedDurationMinutes:
          type: integer
          example: 25
        estimatedFare:
          type: number
          format: double
          example: 85000

    Ride:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: USR001
        driver:
          nullable: true
          $ref: '#/components/schemas/DriverSummary'
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        status:
          $ref: '#/components/schemas/RideStatus'
        etaMinutes:
          type: integer
          nullable: true
          example: 5
        fare:
          type: number
          format: double
          nullable: true
          example: 85000
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    DriverSummary:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: '0909999999'
        rating:
          type: number
          format: float
          example: 4.8
        vehicle:
          $ref: '#/components/schemas/VehicleSummary'

    Driver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        userId:
          type: string
          example: USR100
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: '0909999999'
        rating:
          type: number
          format: float
          example: 4.8
        availability:
          $ref: '#/components/schemas/DriverAvailability'
        location:
          $ref: '#/components/schemas/Location'
        vehicle:
          $ref: '#/components/schemas/Vehicle'

    CreateDriverRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: '0909999999'
        email:
          type: string
          format: email

    UpdateDriverRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    AdminUpdateDriverRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateDriverRequest'
        - type: object
          properties:
            availability:
              $ref: '#/components/schemas/DriverAvailability'

    DriverStatusRequest:
      type: object
      required: [availability]
      properties:
        availability:
          $ref: '#/components/schemas/DriverAvailability'

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          example: VEH001
        driverId:
          type: string
          example: DRV001
        type:
          $ref: '#/components/schemas/ServiceType'
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios
        licensePlate:
          type: string
          example: 51A-123.45
        verified:
          type: boolean
          example: true

    VehicleSummary:
      type: object
      properties:
        vehicleId:
          type: string
          example: VEH001
        type:
          $ref: '#/components/schemas/ServiceType'
        licensePlate:
          type: string
          example: 51A-123.45

    UpdateVehicleRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ServiceType'
        brand:
          type: string
        model:
          type: string
        licensePlate:
          type: string

    AdminUpdateVehicleRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateVehicleRequest'
        - type: object
          properties:
            verified:
              type: boolean

    MatchingStatus:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        status:
          type: string
          enum:
            - SEARCHING
            - DRIVER_CONTACTED
            - DRIVER_ASSIGNED
            - SEARCHING_NEXT_DRIVER
            - NO_DRIVER_AVAILABLE
        currentDriver:
          nullable: true
          $ref: '#/components/schemas/DriverSummary'
        attempt:
          type: integer
          example: 2
        message:
          type: string
          example: Đang tìm tài xế phù hợp gần bạn.

    UpdateRideStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ARRIVED, PICKED_UP, IN_PROGRESS, COMPLETED]

    CancelRideRequest:
      type: object
      properties:
        reason:
          type: string
          example: Khách hàng thay đổi kế hoạch

    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        distanceKm:
          type: number
          format: double
          example: 8.5
        durationMinutes:
          type: integer
          example: 25
        baseFare:
          type: number
          format: double
          example: 12000
        distanceFare:
          type: number
          format: double
          example: 60000
        otherFee:
          type: number
          format: double
          example: 13000
        total:
          type: number
          format: double
          example: 85000
        currency:
          type: string
          example: VND

    CreatePaymentRequest:
      type: object
      required: [rideId, method]
      properties:
        rideId:
          type: string
          example: RIDE001
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paymentToken:
          type: string
          nullable: true
          description: Token/reference từ payment provider. Không phải số thẻ hoặc CVV.
          example: provider-token-123

    Payment:
      type: object
      properties:
        paymentId:
          type: string
          example: PAY001
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 85000
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionId:
          type: string
          nullable: true
          example: TXN123456
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        notificationId:
          type: string
          example: NOTI001
        type:
          type: string
          enum:
            - RIDE_ACCEPTED
            - DRIVER_ARRIVED
            - RIDE_COMPLETED
            - PAYMENT_RESULT
            - RIDE_REQUEST
            - RIDE_UPDATED
        title:
          type: string
          example: Tài xế đã nhận chuyến
        message:
          type: string
          example: Tài xế Trần Văn B đã nhận chuyến của bạn.
        read:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    SupportRideRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          example: Tài xế báo không thể cập nhật trạng thái chuyến.

    AuditLog:
      type: object
      properties:
        logId:
          type: string
          example: LOG001
        actorId:
          type: string
          example: STAFF001
        actorRole:
          $ref: '#/components/schemas/Role'
        action:
          type: string
          example: UPDATE_DRIVER
        resourceType:
          type: string
          example: DRIVER
        resourceId:
          type: string
          example: DRV001
        timestamp:
          type: string
          format: date-time
        result:
          type: string
          enum: [SUCCESS, FAILED]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    CustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/Pagination'

    DriverPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        pagination:
          $ref: '#/components/schemas/Pagination'

    VehiclePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RidePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PaymentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RideReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalRides:
          type: integer
          example: 12500
        completedRides:
          type: integer
          example: 11000
        cancelledRides:
          type: integer
          example: 900
        otherRides:
          type: integer
          example: 600

    RevenueReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalRevenue:
          type: number
          format: double
          example: 1250000000
        currency:
          type: string
          example: VND

    RateReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalRides:
          type: integer
          example: 12500
        rate:
          type: number
          format: float
          example: 88.0
        unit:
          type: string
          example: percent

    DriverPerformanceReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        drivers:
          type: array
          items:
            type: object
            properties:
              driverId:
                type: string
                example: DRV001
              completedRides:
                type: integer
                example: 180
              acceptedRides:
                type: integer
                example: 200
              cancelledRides:
                type: integer
                example: 5
              acceptanceRate:
                type: number
                format: float
                example: 90.0
              completionRate:
                type: number
                format: float
                example: 97.2
              rating:
                type: number
                format: float
                example: 4.8

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
        timestamp:
          type: string
          format: date-time
