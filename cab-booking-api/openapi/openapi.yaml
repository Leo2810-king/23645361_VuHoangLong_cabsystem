openapi: 3.0.3

info:
  title: CAB Booking API
  version: 1.0.0
  description: |
    Đặc tả API cho hệ thống đặt xe CAB.

    Phạm vi nghiệp vụ:
    - BR01: Quản lý tài khoản khách hàng
    - BR02: Đặt xe
    - BR03: Tìm và phân công tài xế
    - BR04: Theo dõi chuyến đi
    - BR05: Quản lý thanh toán và tính cước
    - BR06: Thông báo
    - BR07: Quản lý tài xế và phương tiện
    - BR08: Quản lý vận hành
    - BR09: Phân quyền và bảo mật
    - BR10: Báo cáo
    - BR11: Khả năng mở rộng

    Thiết kế này dùng JWT Bearer Authentication và RBAC.
    Đây là API specification; để nút "Try it out" gọi được API thật cần có backend
    triển khai tại server URL tương ứng.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Backend

tags:
  - name: Authentication
    description: BR01 - Tài khoản khách hàng
  - name: Customers
    description: BR01 - Thông tin khách hàng
  - name: Rides
    description: BR02/BR04 - Đặt và theo dõi chuyến đi
  - name: Driver Matching
    description: BR03 - Tìm và phân công tài xế
  - name: Drivers
    description: BR07 - Tài xế
  - name: Vehicles
    description: BR07 - Phương tiện
  - name: Payments
    description: BR05 - Tính cước và thanh toán
  - name: Notifications
    description: BR06 - Thông báo
  - name: Administration
    description: BR08/BR09 - Quản lý vận hành và phân quyền
  - name: Audit
    description: BR09 - Audit log
  - name: Reports
    description: BR10 - Báo cáo

paths:

  /auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản khách hàng
      description: |
        Đáp ứng BR01, FR01, AC01.
        Tạo tài khoản khách hàng mới. Không yêu cầu đăng nhập trước.
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Số điện thoại hoặc email đã tồn tại

  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      description: Đáp ứng BR01, FR02, FR04, FR56 và AC01, AC14.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Thông tin đăng nhập không hợp lệ

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Đăng xuất
      description: Đáp ứng BR01, FR02.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'

  /customers/me:
    get:
      tags: [Customers]
      summary: Xem thông tin cá nhân
      description: Đáp ứng BR01, FR03, AC01.
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Customers]
      summary: Cập nhật thông tin cá nhân
      description: Đáp ứng BR01, FR03, AC01.
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rides/estimate:
    post:
      tags: [Rides]
      summary: Tính thông tin chuyến đi dự kiến
      description: |
        Đáp ứng BR02, FR05-FR09, AC02.
        API này chỉ ước tính, chưa tạo yêu cầu đặt xe.
      operationId: estimateRide
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequest'
      responses:
        '200':
          description: Thông tin chuyến đi dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rides:
    post:
      tags: [Rides]
      summary: Tạo yêu cầu đặt xe
      description: |
        Đáp ứng BR02, FR05-FR10, AC02.
        Khách hàng phải cung cấp điểm đón, điểm đến và loại xe/dịch vụ.
      operationId: createRide
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rides/{rideId}:
    get:
      tags: [Rides]
      summary: Xem chi tiết và trạng thái chuyến đi
      description: Đáp ứng BR04, FR20-FR23, AC06.
      operationId: getRide
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/cancel:
    post:
      tags: [Rides]
      summary: Hủy chuyến
      description: Hỗ trợ nghiệp vụ chuyến đi và tỷ lệ hủy của BR10. Quy tắc hủy cụ thể do chính sách hệ thống quy định.
      operationId: cancelRide
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRideRequest'
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/matching:
    post:
      tags: [Driver Matching]
      summary: Bắt đầu hoặc tiếp tục tìm tài xế
      description: |
        Đáp ứng BR03, FR11-FR16, AC03.
        Hệ thống lọc tài xế online/available, loại xe phù hợp và ưu tiên tài xế gần khách hàng.
      operationId: startDriverMatching
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Kết quả tìm tài xế hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/matching/status:
    get:
      tags: [Driver Matching]
      summary: Xem trạng thái tìm tài xế
      description: |
        Đáp ứng BR03, FR18-FR19, AC04-AC05.
        Nếu tài xế Reject hoặc không phản hồi trong thời hạn, hệ thống tiếp tục tìm tài xế khác.
      operationId: getMatchingStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Trạng thái matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/accept:
    post:
      tags: [Driver Matching]
      summary: Tài xế chấp nhận chuyến
      description: Đáp ứng BR03, FR17, AC03.
      operationId: acceptRide
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Tài xế nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chuyến đã được tài xế khác nhận hoặc không còn khả dụng

  /rides/{rideId}/reject:
    post:
      tags: [Driver Matching]
      summary: Tài xế từ chối chuyến
      description: Đáp ứng BR03, FR17-FR18, AC04. Sau khi Reject, hệ thống tự động chuyển sang tài xế tiếp theo.
      operationId: rejectRide
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Từ chối thành công và hệ thống tiếp tục matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rides/{rideId}/status:
    patch:
      tags: [Rides]
      summary: Cập nhật trạng thái chuyến đi
      description: |
        Đáp ứng BR04, FR24-FR27, AC07.
        Luồng trạng thái hợp lệ:
        ARRIVED -> PICKED_UP -> IN_PROGRESS -> COMPLETED.
      operationId: updateRideStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRideStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chuyển trạng thái không hợp lệ

  /rides/{rideId}/location:
    patch:
      tags: [Rides]
      summary: Cập nhật vị trí tài xế trong chuyến
      description: Đáp ứng BR04, FR23, AC06.
      operationId: updateRideLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Cập nhật vị trí thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rides/{rideId}/fare:
    get:
      tags: [Payments]
      summary: Tính và xem cước chuyến đi
      description: Đáp ứng BR05, FR28, AC08.
      operationId: getRideFare
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Chi tiết cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments:
    post:
      tags: [Payments]
      summary: Tạo giao dịch thanh toán
      description: |
        Đáp ứng BR05, FR29-FR33, AC09.
        Hỗ trợ CASH và phương thức điện tử.
        Không nhận hoặc lưu số thẻ/CVV trong CAB; thanh toán điện tử nên dùng token/reference
        do nhà cung cấp thanh toán cấp.
      operationId: createPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Giao dịch được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Xem kết quả thanh toán
      description: Đáp ứng BR05, FR33-FR34, AC09-AC10.
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Chi tiết giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{paymentId}/retry:
    post:
      tags: [Payments]
      summary: Thử lại thanh toán
      description: Đáp ứng BR05, FR34-FR35, AC10.
      operationId: retryPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Đã yêu cầu thanh toán lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Giao dịch không được phép retry theo chính sách

  /notifications:
    get:
      tags: [Notifications]
      summary: Xem thông báo
      description: Đáp ứng BR06, FR36-FR42, AC11.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Đánh dấu thông báo đã đọc
      description: Hỗ trợ BR06.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: Đã đánh dấu đã đọc
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers:
    post:
      tags: [Drivers]
      summary: Tạo tài khoản tài xế
      description: Đáp ứng BR07, FR43, AC12. Có thể do tài xế đăng ký hoặc nhân viên có quyền tạo.
      operationId: createDriver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Tạo tài khoản tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me:
    get:
      tags: [Drivers]
      summary: Xem hồ sơ tài xế
      description: Đáp ứng BR07, FR44, AC12.
      operationId: getMyDriverProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Drivers]
      summary: Cập nhật hồ sơ tài xế
      description: Đáp ứng BR07, FR44, AC12.
      operationId: updateMyDriverProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me/status:
    patch:
      tags: [Drivers]
      summary: Cập nhật trạng thái online/offline/available
      description: Đáp ứng BR07, FR46-FR47, AC12.
      operationId: updateDriverStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me/location:
    patch:
      tags: [Drivers]
      summary: Cập nhật vị trí tài xế
      description: Đáp ứng BR07, FR48, AC12.
      operationId: updateDriverLocation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Cập nhật vị trí thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me/vehicle:
    get:
      tags: [Vehicles]
      summary: Xem phương tiện của tài xế
      description: Đáp ứng BR07, FR45, AC12.
      operationId: getMyVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Vehicles]
      summary: Cập nhật phương tiện
      description: Đáp ứng BR07, FR45, AC12.
      operationId: updateMyVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: Cập nhật phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me/rides:
    get:
      tags: [Drivers]
      summary: Xem các chuyến liên quan đến tài xế
      description: Hỗ trợ BR07 và BR04.
      operationId: listDriverRides
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers:
    get:
      tags: [Administration]
      summary: Xem danh sách khách hàng
      description: Đáp ứng BR08, FR49, AC13. Chỉ STAFF/ADMIN.
      operationId: adminListCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
